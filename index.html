t(new T.Color().setHSL((i*.09+.52)%1,.6,.55))),slotX=[-1.9,-.63,.63,1.9],slots=[null,null,null,null],objects=[],nums=[];slotX.forEach((x,i)=>{box(x,1.18,-7.5,1,.2,1,purple);let n=label(String(i+1),.3);n.position.set(x,1.35,-7.5);n.rotation.x=-Math.PI/2;scene.add(n);nums.push(n)});let balls=[];function spawnBall(n,x,z){let g=new T.Group(),s=new T.Mesh(new T.SphereGeometry(.31,20,16),colors[n]),t=label(String(n),.38);t.position.z=.32;g.add(s,t);g.position.set(x,.45,z);scene.add(g);balls.push({n,x,z,g})}const initial=[1,9,3,7,2,5,4,6,8,1,7,9,3,5,2,8];function spawn(){balls.forEach(b=>scene.remove(b.g));balls=[];initial.forEach((n,i)=>spawnBall(n,-9+(i%4)*6,-4+Math.floor(i/4)*4.3))}spawn();let held=null,x=0,z=7,yaw=0,pitch=0,st=5,run=false,jx=0,jy=0,won=false;function nearby(){let best=null,d=2;for(let b of balls){let a=Math.hypot(b.x-x,b.z-z);if(a<d){d=a;best={b}}}slotX.forEach((sx,i)=>{let a=Math.hypot(sx-x,-7.5-z);if(a<d+.2){d=a;best={i}}});return best}function drawSlots(){objects.forEach(o=>scene.remove(o));objects.length=0;slots.forEach((n,i)=>{nums[i].visible=n===null;if(n!==null){let m=new T.Mesh(new T.SphereGeometry(.27,20,14),colors[n]);m.position.set(slotX[i],1.57,-7.5);scene.add(m);objects.push(m);let t=label(String(n),.32);t.position.set(slotX[i],1.57,-7.18);scene.add(t);objects.push(t)}})}function hud(){let t=nearby();$('hint').textContent=won?'🏆 승리! 초기화로 다시 시작':t?.b?'숫자 '+t.b.n+' 구슬':t?.i!==undefined?'슬롯 '+(t.i+1)+' · '+(slots[t.i]??'비어 있음'):'';$('use').textContent=t?.i!==undefined?'넣기':'줍기';$('held').textContent='손에 든 구슬: '+(held??'없음');$('count').textContent=slots.filter(n=>n!==null).length;$('goal').textContent=slots.map((n,i)=>n??(i===0?'1':'_')).join(' ');$('bar').style.width=st*20+'%'}function use(){if(won)return;let t=nearby();if(!t)return;if(t.b){if(held!==null)return;held=t.b.n;scene.remove(t.b.g);balls.splice(balls.indexOf(t.b),1)}else{let old=slots[t.i];slots[t.i]=held;held=old;drawSlots();if(slots.join('')==='1937'){won=true;$('hint').textContent='🏆 PURPLE TEAM 승리!'}}hud()}function drop(){if(held===null)return;spawnBall(held,Math.max(-10,Math.min(10,x+Math.sin(yaw))),Math.max(-10,Math.min(10,z-Math.cos(yaw))));held=null;hud()}function reset(){slots.fill(null);held=null;x=0;z=7;st=5;won=false;spawn();drawSlots();hud()}$('use').onpointerdown=use;$('drop').onpointerdown=drop;$('reset').onpointerdown=reset;$('run').onpointerdown=()=>run=true;['pointerup','pointercancel','pointerleave'].forEach(e=>$('run').addEventListener(e,()=>run=false));$('start').onclick=()=>{$('overlay').style.display='none';screen.orientation?.lock?.('landscape')?.catch?.(()=>{})};let jid=null;const joy=$('joy');function jm(e){let a=joy.getBoundingClientRect(),dx=e.clientX-a.left-57,dy=e.clientY-a.top-57,d=Math.max(1,Math.hypot(dx,dy));jx=dx/d*Math.min(1,d/42);jy=dy/d*Math.min(1,d/42);$('knob').style.transform='translate('+jx*38+'px,'+jy*38+'px)'}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;$('knob').style.transform=''}};let lid=null,lx=0,ly=0;r.domElement.onpointerdown=e=>{lid=e.pointerId;lx=e.clientX;ly=e.clientY;r.domElement.setPointerCapture(lid)};r.domElement.onpointermove=e=>{if(lid!==e.pointerId)return;yaw-=(e.clientX-lx)*.0045;pitch=Math.max(-1.1,Math.min(1.1,pitch-(e.clientY-ly)*.0045));lx=e.clientX;ly=e.clientY};r.domElement.onpointerup=r.domElement.onpointercancel=()=>lid=null;const keys={};onkeydown=e=>{keys[e.code]=true;if(e.code==='KeyE'&&!e.repeat)use();if(e.code==='KeyR'&&!e.repeat)drop()};onkeyup=e=>keys[e.code]=false;const clock=new T.Clock();let tick=0;function frame(){requestAnimationFrame(frame);let dt=Math.min(.05,clock.getDelta()),dx=jx+(keys.KeyD?1:0)-(keys.KeyA?1:0),dz=-jy+(keys.KeyW?1:0)-(keys.KeyS?1:0),m=Math.hypot(dx,dz);if(m>1){dx/=m;dz/=m}let sprint=(run||keys.ShiftLeft)&&st>0&&m>.1;st=Math.max(0,Math.min(5,st+(sprint?-1:1.5)*dt));let v=(sprint?7:4)*dt;x=Math.max(-10.7,Math.min(10.7,x+(Math.cos(yaw)*dx+Math.sin(yaw)*dz)*v));z=Math.max(-10.7,Math.min(10.7,z+(Math.sin(yaw)*dx-Math.cos(yaw)*dz)*v));if(z<-6.5&&z>-9.6&&Math.abs(x)<3.7)z=z>-8?-6.5:-9.6;cam.position.set(x,1.65,z);cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch;balls.forEach((b,i)=>{b.g.rotation.y+=dt*.7;b.g.position.y=.46+Math.sin(performance.now()*.002+i)*.06;b.g.children[1].quaternion.copy(cam.quaternion)});tick+=dt;if(tick>.15){hud();tick=0}r.render(scene,cam)}onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};hud();frame();</script></html>
