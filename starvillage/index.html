function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function boardTalk(){let q=db.quests,ok=q.collected>=5&&q.letter&&q.tree;modal('📋 오늘의 사총사 미션',`<p>따로 지내는 날에도 같은 마을에서 이어지는 작은 모험!</p><div class="option">⭐ 별사탕 5개 주워보기 <strong>${Math.min(5,q.collected||0)}/5</strong></div><div class="option">💌 친구에게 마음 한 통 쓰기 <strong>${q.letter?'완료!':'진행 중'}</strong></div><div class="option">🌳 우정나무 한 번 성장시키기 <strong>${q.tree?'완료!':'진행 중'}</strong></div><div class="bubbleItem">🎁 세 가지 완료 시 별사탕 20개 획득!</div><button class="bigBtn gold" data-action="claim" ${!ok||q.rewarded?'disabled':''}>${q.rewarded?'🏅 오늘 보상 받았어!':'🎁 보상 받기'}</button><p class="tiny">미션은 날짜가 바뀌면 다시 시작돼. 편지는 이 기기에 저장돼.</p>`)}

function inbox(){let rows=db.letters.filter(l=>l.from===db.hero||l.to===db.hero);modal('📬 우리들의 편지함',`<p>사총사의 마음이 쌓이는 곳</p><div class="book">${rows.length?rows.slice().reverse().map(l=>`<div class="bubbleItem"><span class="label">${PEOPLE[l.from].name} → ${PEOPLE[l.to].name} · ${l.day}</span><div>${escapeHTML(l.text)}</div></div>`).join(''):'아직 편지가 없어.'}</div>${rowBtn('💌 새 편지 쓰기','mail')}`)}
function questionTalk(){const q=QUESTIONS[db.questionIndex%QUESTIONS.length];modal('🎲 사총사 이야기 주사위',`<div style="font-size:58px;text-align:center">🎲</div><p style="font-size:20px;color:#77568e;text-align:center;margin:16px 0">${q}</p><div class="bubbleItem">🍓 같이 있을 때 얘기해봐도 좋고, 카톡에 이 질문을 던져봐도 좋아.</div>${rowBtn('🎲 다른 질문 뽑기','question','gold')}<button class="bigBtn green" data-action="copyQuestion">📋 질문 복사하기</button>`)}
function pondTalk(){modal('🎣 반짝 연못',`<div style="font-size:56px;text-align:center">🐟✨🌊</div><p>물 위에서 반짝이는 별을 빠르게 터치해봐! 15초 동안 별을 모으는 진짜 미니게임이야.</p><div class="bubbleItem">🎮 별을 1개 잡으면 별사탕도 1개씩 가져갈 수 있어. 한 번에 최대 15개!</div>${rowBtn('🌟 별낚시 시작하기','minigame','gold')}`)}

function shopTalk(){modal('🎨 마을 꾸미기 공방',`<p>모험으로 모은 별사탕으로 우리 마을에 작은 장식을 놓을 수 있어!</p>${Object.keys(PRICES).map(id=>`<div class="option"><span>${LABELS[id]}</span><strong>${db.decor.includes(id)?'설치 완료':'⭐ '+PRICES[id]}</strong><button data-action="buy:${id}" ${db.decor.includes(id)||db.stars<PRICES[id]?'disabled':''}>${db.decor.includes(id)?'완료':'구매'}</button></div>`).join('')}<div class="tiny">장식은 월드에 실제로 나타나. 친구의 기기로 자동 반영되지는 않아.</div>`)}
function journalTalk(){modal('📷 우리의 추억 사진관',`<p>오늘의 감정과 기억을 한 조각 남겨두자. 별마을에 돌아오면 언제든 다시 열어볼 수 있어.</p><div class="row"><button class="choice" data-action="mood:😊">😊 좋음</button><button class="choice" data-action="mood:🥹">🥹 뭉클</button><button class="choice" data-action="mood:🥲">🥲 지침</button><button class="choice" data-action="mood:🥳">🥳 신남</button></div><label class="label">오늘의 한 줄</label><textarea class="textField" maxlength="240" id="journalText" rows="3" placeholder="오늘 있었던 조그만 일도 좋아..."></textarea><button class="bigBtn" data-action="journalSave">🌷 추억 한 장 남기기</button><button class="bigBtn green" data-action="album">📖 사총사 추억 앨범 (${db.journal.length})</button><p class="tiny">글은 이 기기에만 저장돼. 사진이나 실시간 공동 앨범은 다음 버전에서 연결할 수 있어.</p>`)}
function album(){modal('📖 사총사 추억 앨범',`<p>아무렇지 않은 오늘도 훗날에는 소중한 기억!</p><div class="book">${db.journal.length?db.journal.slice().reverse().map(j=>`<div class="bubbleItem"><span class="label">${j.mood} ${PEOPLE[j.author]?.name||'사총사'} · ${j.day}</span><div>${escapeHTML(j.text)}</div></div>`).join(''):'아직 남긴 기록이 없어. 첫 한 줄을 남겨봐! 🌷'}</div><button class="bigBtn" data-action="photo">✍️ 오늘 기록 남기기</button>`)}
function capsuleTalk(){let open=db.letters.filter(l=>l.type==='capsule');modal('⏳ 시간의 우물',`<p>미래의 사총사에게 마음을 담아 보내는 타임캡슐. 정해진 날이 오면 열어볼 수 있어.</p><textarea class="textField" rows="3" maxlength="300" id="capsuleText" placeholder="미래의 우리에게 하고 싶은 이야기..."></textarea><select class="textField" id="capsuleDays"><option value="7">7일 뒤 열기</option><option value="30">30일 뒤 열기</option><option value="365">1년 뒤 열기</option></select><button class="bigBtn" data-action="capsuleSave">🔒 시간의 우물에 넣기</button><div class="book">${open.slice().reverse().map(l=>`<div class="bubbleItem"><span class="label">${l.day}의 타임캡슐 · ${l.unlock}</span><div>${new Date()>=new Date(l.unlock+'T00:00:00')?escapeHTML(l.text):'🔒 아직 열리지 않았어'}</div></div>`).join('')}</div>`)}
function bagTalk(){modal('🎒 나의 모험 가방',`<p>💖 사총사 별마을의 소중한 여행자 ${PEOPLE[db.hero].name}!</p><div class="option">⭐ 별사탕 <strong>${db.stars}개</strong></div><div class="option">🌳 우정나무 <strong>Lv.${db.tree}</strong></div><div class="option">✨ 지금까지 모은 별 <strong>${db.totalStars}개</strong></div><div class="option">🏡 방문한 친구 <strong>${db.visited.length}/4</strong></div><div class="option">🎨 꾸민 장식 <strong>${db.decor.length}/4</strong></div><p>🎮 내 캐릭터 변경</p><div class="row">${PEOPLE.map((p,i)=>`<button class="choice ${db.hero===i?'active':''}" data-action="hero:${i}">${p.emoji} ${p.name}</button>`).join('')}</div>${rowBtn('🗺️ 마을 지도 보기','map')}${rowBtn('💾 모험 기록 저장하기','backup','green')}<p class="tiny">키보드: WASD/방향키 이동, E/스페이스 상호작용. 터치: 가상 조이스틱, 오른쪽 별 버튼. 모든 데이터는 이 기기의 브라우저에만 저장돼.</p>`)}
function mapTalk(){let rows=[['🌸 우정나무','마을 중앙 위쪽'],['📋 소원 게시판','광장 왼쪽'],['💌 분홍 우체통','광장 오른쪽'],['📷 추억 사진관','왼쪽 길'],['🎨 꾸미기 공방','왼쪽 아래'],['🎣 반짝 연못','오른쪽 아래'],['🔥 별빛 캠프','아래쪽'],['⏳ 시간의 우물','남쪽 길']];modal('🗺️ 별마을 모험 지도',`<p>집과 길을 따라 걸으면 다른 장소가 나와. 화면 왼쪽 조이스틱으로 이동해봐!</p><div style="background:#d4efc3;border:4px solid #fff;border-radius:19px;padding:14px;text-align:center;box-shadow:inset 0 0 0 3px #a1c9b1;color:#735c8c;font-size:19px;line-height:2.4">🏠　🏡　🌳　🏠　🏡<br>🌼 ── 🌸 ── 💌<br>📷　✨ 🧍 ✨　🎣<br>🎨 ── ⛲ ── 🔥<br>　　⏳　🌷</div><div class="book">${rows.map(r=>`<div class="option">${r[0]}<strong>${r[1]}</strong></div>`).join('')}</div>${rowBtn('🌱 마을로 돌아가기','close','green')}`)}
let selectedMood='😊';function updatePrompt(){let best=null,dist=Infinity;for(let o of OBJECTS){let d=Math.hypot(pos.x-o.x,pos.y-o.y);if(d<dist){dist=d;best=o}}nearest=dist<Math.min(best?.r||130,150)?best:null;$('#prompt').style.opacity=nearest?'1':'0';if(nearest)$('#prompt').textContent=nearest.emoji+' '+nearest.tip+' · ✨ 버튼';}
function trigger(){if(dialog||mini)return;if(nearest)doInteract(nearest);else note('🌷 길을 따라 마을 곳곳을 탐험해봐!')}
function action(a){if(a==='close'){close();return}if(a==='map'){mapTalk();return}if(a==='mail'){mailTalk();return}if(a==='photo'){journalTalk();return}if(a==='inbox'){inbox();return}if(a==='album'){album();return}if(a.startsWith('hero:')){db.hero=+a.split(':')[1];save();close();note('✨ '+PEOPLE[db.hero].name+'로 변신!');hud();cssToastSpark();return}if(a.startsWith('letter:')){mailTalk(+a.split(':')[1]);return}if(a==='send'){let to=Number($('#to')?.value),val=$('#letterText')?.value.trim();if(!val)return note('한마디라도 적어줘!');db.letters.push({from:db.hero,to,text:val,day:TODAY()});db.quests.letter=true;db.stars+=3;save();close();note('💌 편지 완성! 별사탕 +3');cssToastSpark();return}if(a==='grow'){if(db.stars<5||db.tree>=8)return;db.stars-=5;db.tree++;db.quests.tree=true;save();close();note('🌸 우정나무가 자랐어!');cssToastSpark();return}if(a==='claim'){if(db.quests.collected>=5&&db.quests.letter&&db.quests.tree&&!db.quests.rewarded){db.quests.rewarded=true;db.stars+=20;save();close();note('🏆 미션 성공! 별사탕 +20');cssToastSpark()}return}if(a==='question'){db.questionIndex++;save();questionTalk();return}if(a==='copyQuestion'){let q=QUESTIONS[db.questionIndex%QUESTIONS.length];navigator.clipboard?.writeText('사총사 오늘의 질문! 🎲\n'+q).then(()=>note('📋 질문이 복사됐어!')).catch(()=>note(q));return}if(a.startsWith('mood:')){selectedMood=a.split(':')[1];document.querySelectorAll('.choice[data-action^="mood:"]').forEach(b=>b.classList.toggle('active',b.dataset.action===a));return}if(a==='journalSave'){let v=$('#journalText')?.value.trim();if(!v)return note('오늘의 한 줄을 적어줘!');db.journal.push({author:db.hero,text:v,mood:selectedMood,day:TODAY()});db.stars+=2;save();close();note('📷 우리의 추억 +1! 별사탕 +2');cssToastSpark();return}if(a==='capsuleSave'){let v=$('#capsuleText')?.value.trim(),days=Number($('#capsuleDays')?.value||7);if(!v)return note('미래에 전할 말을 남겨줘!');let dt=new Date();dt.setDate(dt.getDate()+days);db.letters.push({type:'capsule',text:v,from:db.hero,to:db.hero,day:TODAY(),unlock:dt.toLocaleDateString('sv-SE')});save();close();note('⏳ 시간 속에 마음을 숨겼어!');return}if(a.startsWith('buy:')){let id=a.slice(4),price=PRICES[id];if(!price||db.decor.includes(id)||db.stars<price)return;db.stars-=price;db.decor.push(id);save();close();note('🎨 '+LABELS[id]+' 설치 성공!');cssToastSpark();return}if(a==='minigame'){close();openMini();return}if(a==='backup'){let data=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(data),a=document.createElement('a');a.href=url;a.download='사총사-별마을-모험기록.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);note('💾 모험 기록을 저장했어!');return}}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))close();let b=e.target.closest('[data-action]');if(b)action(b.dataset.action)});$('#close').addEventListener('click',close);$('#menu').addEventListener('click',bagTalk);$('#mapBtn').addEventListener('click',mapTalk);$('#act').addEventListener('click',trigger);
let miniTimer=null,miniStars=[],miniHits=0,miniStart=0;
function openMini(){mini=true;miniHits=0;miniStars=[];$('#miniLayer').classList.add('open');$('#minigame').innerHTML=`<h2 style="margin:0">🌟 반짝별 낚시</h2><div id="miniTime">15초 남았어 · ⭐ 0개</div><div id="miniField" class="miniField"></div><button class="bigBtn" id="miniDone">그만하기</button>`;$('#miniDone').onclick=stopMini;miniStart=performance.now();miniTimer=setInterval(()=>{let rest=Math.max(0,15-(performance.now()-miniStart)/1000);let label=$('#miniTime');if(label)label.textContent=`${rest.toFixed(1)}초 남았어 · ⭐ ${miniHits}개`;if(rest<=0){stopMini();return}if(Math.random()<.7&&miniStars.length<7){let div=document.createElement('button'),field=$('#miniField');div.className='fallStar';div.textContent=Math.random()<.15?'💖':'⭐';let x=8+Math.random()*76,y=5+Math.random()*72;div.style.left=x+'%';div.style.top=y+'%';div.style.transform='rotate('+(Math.random()*40-20)+'deg)';field.appendChild(div);miniStars.push(div);div.onclick=()=>{if(miniHits<15){miniHits++;div.remove();miniStars=miniStars.filter(a=>a!==div)}};setTimeout(()=>{div.remove();miniStars=miniStars.filter(a=>a!==div)},1900)}},360)}
function stopMini(){if(!mini)return;mini=false;clearInterval(miniTimer);$('#miniLayer').classList.remove('open');db.stars+=miniHits;db.totalStars+=miniHits;save();hud();note('🎣 별낚시 성공! ⭐ +'+miniHits);if(miniHits)cssToastSpark()}
function joyUpdate(e){let r=$('#joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=38,l=Math.hypot(dx,dy);let v=Math.min(1,l/max);joy.x=l?dx/l*v:0;joy.y=l?dy/l*v:0;$('#knob').style.transform=`translate(calc(-50% + ${joy.x*35}px),calc(-50% + ${joy.y*35}px))`}
$('#joystick').addEventListener('pointerdown',e=>{e.preventDefault();joy.pointer=e.pointerId;$('#joystick').setPointerCapture(e.pointerId);joyUpdate(e)});$('#joystick').addEventListener('pointermove',e=>{if(joy.pointer===e.pointerId){e.preventDefault();joyUpdate(e)}});function releaseJoy(e){if(joy.pointer===e.pointerId){joy.pointer=null;joy.x=0;joy.y=0;$('#knob').style.transform='translate(-50%,-50%)'}}$('#joystick').addEventListener('pointerup',releaseJoy);$('#joystick').addEventListener('pointercancel',releaseJoy);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d','e','W','A','S','D','E'].includes(e.key)&&!dialog&&!mini&&document.activeElement?.tagName!=='TEXTAREA'){e.preventDefault();keys[e.key.toLowerCase()]=true;if((e.key.toLowerCase()==='e'||e.key===' ')&&!e.repeat)trigger()}});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
$('#startBtn').addEventListener('click',()=>{$('#startScreen').classList.add('hidden');note('🌷 '+PEOPLE[db.hero].name+'! 별마을에 어서 와!');save()});
function gameStep(t,dt){let ax=joy.x+(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0),ay=joy.y+(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);let l=Math.hypot(ax,ay);if(!dialog&&!mini&&l>.06){let speed=265*dt;pos.x=Math.max(74,Math.min(W-74,pos.x+ax/Math.max(1,l)*speed));pos.y=Math.max(115,Math.min(H-65,pos.y+ay/Math.max(1,l)*speed));walk+=dt*9;if(Math.random()<.036)particles.push({x:pos.x+(Math.random()-.5)*26,y:pos.y+17,vx:(Math.random()-.5)*17,vy:-9,age:0,life:.5,size:3,color:'#fefce5'})}else walk=0;cam.x+=(pos.x-cam.x)*Math.min(1,dt*6);cam.y+=(pos.y-cam.y)*Math.min(1,dt*6);for(let i=0;i<stars.length;i++){let s=stars[i];if(Math.hypot(pos.x-s.x,pos.y-s.y)<37&&!dialog&&!mini){collect(s.x,s.y);stars[i]=randomSpot()}}updatePrompt();acc+=dt;if(acc>4){db.pos={x:Math.round(pos.x),y:Math.round(pos.y)};save();acc=0}}
function frame(ms){const t=ms/1000,dt=Math.min(.04,last?(ms-last)/1000:0);last=ms;gameStep(t,dt);ctx.setTransform(view.dpr,0,0,view.dpr,0,0);ctx.clearRect(0,0,view.w,view.h);ctx.fillStyle='#9bd8a5';ctx.fillRect(0,0,view.w,view.h);ctx.save();ctx.translate(view.w/2,view.h/2);ctx.scale(view.scale,view.scale);ctx.translate(-cam.x,-cam.y);grass();road();drawObjects(t);drawLabels(t);
for(let s of stars)if(Math.abs(s.x-cam.x)<view.w/view.scale*.75&&Math.abs(s.y-cam.y)<view.h/view.scale*.75)drawStar(s.x,s.y,t+s.phase);
for(let npc of NPCS){const p=PEOPLE[npc.i];let nx=npc.x+Math.cos(t*.55+npc.phase)*32,ny=npc.y+Math.sin(t*.7+npc.phase)*20;drawCharacter(nx,ny,npc.i,.82,t,false);if(Math.hypot(nx-pos.x,ny-pos.y)<210){rr(nx-43,ny-125,86,29,12,'#fffcf5');txt(p.name+' '+p.emoji,nx,ny-110,16,'#88748d')}}
drawCharacter(pos.x,pos.y+Math.sin(walk)*1.5,db.hero,1.05,t,true);
// drifting petals
for(let i=0;i<17;i++){let x=(i*277+t*(16+i%3*5))%W,y=(i*421+Math.sin(t+i)*19)%H;ellipse(x,y,4,2.5,i%3?'#fff3ebad':'#ffc4dfab')}
drawParticles(t,dt);ctx.restore();requestAnimationFrame(frame)}hud();requestAnimationFrame(frame);
})();
</script><script>if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
